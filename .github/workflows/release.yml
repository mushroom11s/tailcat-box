name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (for example v0.1.0). Leave empty to build the selected branch.
        required: false
        type: string
      dry_run:
        description: Build and upload artifacts only; skip creating a GitHub Release
        required: false
        type: boolean
        default: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  GOTOOLCHAIN: auto

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      app_version: ${{ steps.meta.outputs.app_version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      do_release: ${{ steps.meta.outputs.do_release }}
    steps:
      - name: Resolve version and release flag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          checkout_ref="${GITHUB_SHA}"
          version="dev-${GITHUB_SHA::7}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          elif [ -n "${INPUT_TAG}" ]; then
            version="${INPUT_TAG}"
            checkout_ref="${INPUT_TAG}"
          fi

          app_version="${version#v}"
          do_release=false
          if [[ "${version}" == v* ]]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              do_release=true
            elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN}" != "true" ]; then
              do_release=true
            fi
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"
          echo "do_release=${do_release}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version=${version} app_version=${app_version} do_release=${do_release} ref=${checkout_ref}"

  build:
    name: Build ${{ matrix.slug }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            slug: macos
          - os: windows-latest
            slug: windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install MinGW (Windows CGO)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $candidates = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          )
          $mingw = $candidates | Where-Object { Test-Path (Join-Path $_ "gcc.exe") } | Select-Object -First 1
          if (-not $mingw) {
            throw "gcc.exe not found after MinGW install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw
          $env:PATH = "$mingw;$env:PATH"
          gcc --version

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Stamp product version
        env:
          APP_VERSION: ${{ needs.meta.outputs.app_version }}
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("wails.json")
          data = json.loads(path.read_text())
          info = data.setdefault("info", {})
          info["productVersion"] = os.environ["APP_VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"wails.json info.productVersion={info['productVersion']}")
          PY

      - name: Wails build
        env:
          CGO_ENABLED: "1"
          APP_VERSION: ${{ needs.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          extra_ldflags="-X github.com/mushroom11s/tailcat-desktop-client/internal/appinfo.Version=${APP_VERSION}"
          wails build -trimpath -ldflags "${extra_ldflags}"
          ls -la build/bin

      - name: Package artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OS_SLUG: ${{ matrix.slug }}
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/package-wails-artifact.py --version "${VERSION}" --os-slug "${OS_SLUG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailcat-desktop-client-${{ matrix.slug }}-${{ needs.meta.outputs.version }}
          path: dist-upload/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [meta, build]
    if: needs.meta.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true

      - name: Compose release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          if [ -f "${notes}" ]; then
            cp "${notes}" release-notes.md
          elif [ -f docs/releases/README.md ]; then
            {
              echo "## ${VERSION}"
              echo
              echo "No per-tag notes file was found at \`${notes}\`."
              echo "Maintainers: copy \`docs/releases/README.md\` to that path before tagging."
              echo
              cat docs/releases/README.md
            } > release-notes.md
          else
            {
              echo "## ${VERSION}"
              echo
              echo "Automated build of the Tailcat desktop client for macOS and Windows."
              echo "Binaries are unsigned. See README for install warnings and adapter notes."
            } > release-notes.md
          fi
          ls -la collected
          echo "----- notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          body_path: release-notes.md
          files: collected/*.zip
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
