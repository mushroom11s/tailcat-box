name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (for example v0.1.0). Leave empty to build the selected branch.
        required: false
        type: string
      dry_run:
        description: Build and upload artifacts only; skip creating a GitHub Release
        required: false
        type: boolean
        default: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  GOTOOLCHAIN: auto

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      app_version: ${{ steps.meta.outputs.app_version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      do_release: ${{ steps.meta.outputs.do_release }}
    steps:
      - name: Resolve version and release flag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          checkout_ref="${GITHUB_SHA}"
          version="dev-${GITHUB_SHA::7}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          elif [ -n "${INPUT_TAG}" ]; then
            version="${INPUT_TAG}"
            checkout_ref="${INPUT_TAG}"
          fi

          app_version="${version#v}"
          do_release=false
          if [[ "${version}" == v* ]]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              do_release=true
            elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN}" != "true" ]; then
              do_release=true
            fi
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"
          echo "do_release=${do_release}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version=${version} app_version=${app_version} do_release=${do_release} ref=${checkout_ref}"

  build:
    name: Build ${{ matrix.slug }}-${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon. macos-13 was retired; macos-15-intel is the hosted x86_64 runner.
          - os: macos-latest
            slug: macos
            arch: arm64
          - os: macos-15-intel
            slug: macos
            arch: amd64
          - os: windows-latest
            slug: windows
            arch: amd64
          - os: windows-11-arm
            slug: windows
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install MinGW (Windows amd64)
        if: matrix.arch == 'amd64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $candidates = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          )
          $mingw = $candidates | Where-Object { Test-Path (Join-Path $_ "gcc.exe") } | Select-Object -First 1
          if (-not $mingw) {
            throw "gcc.exe not found after MinGW install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw
          $env:PATH = "$mingw;$env:PATH"
          gcc --version

      - name: Install LLVM MinGW (Windows arm64)
        if: matrix.arch == 'arm64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "20260908"
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $dest = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-aarch64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $gcc = Get-ChildItem -Path $dest -Recurse -Filter gcc.exe | Select-Object -First 1
          if (-not $gcc) {
            throw "gcc.exe not found in llvm-mingw"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gcc.DirectoryName
          $env:PATH = "$($gcc.DirectoryName);$env:PATH"
          gcc --version

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "choco install nsis exited $LASTEXITCODE"
          }
          $ErrorActionPreference = "Stop"

          function Find-Makensis {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $roots = @(
              (Join-Path ${env:ProgramFiles(x86)} "NSIS"),
              (Join-Path $env:ProgramFiles "NSIS"),
              (Join-Path $env:ProgramData "chocolatey\bin"),
              (Join-Path $env:ProgramData "chocolatey\lib\nsis")
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { return $hit.FullName }
            }
            return $null
          }

          $makensis = Find-Makensis
          if (-not $makensis) {
            throw "makensis.exe not found after installing NSIS"
          }
          $dir = Split-Path $makensis
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          $env:PATH = "$dir;$env:PATH"
          & $makensis /VERSION

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Stamp product version
        env:
          APP_VERSION: ${{ needs.meta.outputs.app_version }}
          OS_SLUG: ${{ matrix.slug }}
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path("wails.json")
          data = json.loads(path.read_text())
          info = data.setdefault("info", {})
          raw = os.environ["APP_VERSION"]
          product = raw
          # project.nsi sets VIProductVersion to "${INFO_PRODUCTVERSION}.0".
          # NSIS accepts that only when the first three fields are numeric.
          if os.environ.get("OS_SLUG") == "windows" and not re.fullmatch(r"\d+\.\d+\.\d+", raw):
              product = "0.0.0"
              print(f"APP_VERSION {raw!r} is not N.N.N; NSIS productVersion={product}")
          info["productVersion"] = product
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"wails.json info.productVersion={info['productVersion']}")
          PY

      - name: Wails build
        env:
          CGO_ENABLED: "1"
          APP_VERSION: ${{ needs.meta.outputs.app_version }}
          OS_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          extra_ldflags="-X github.com/mushroom11s/tailcat-box/internal/appinfo.Version=${APP_VERSION}"
          if [ "${OS_SLUG}" = "windows" ]; then
            command -v makensis
            # Git Bash rewrites "/VERSION" into C:/Program Files/Git/VERSION.
            MSYS_NO_PATHCONV=1 makensis /VERSION
            # This runner built one arch. Wails passes only that binary to
            # makensis, so the setup exe is single-arch (amd64 or arm64).
            # -nsis also leaves the runnable tailcat-box.exe in build/bin.
            wails build -trimpath -ldflags "${extra_ldflags}" -nsis
          else
            wails build -trimpath -ldflags "${extra_ldflags}"
          fi
          ls -la build/bin

      - name: Package artifact
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OS_SLUG: ${{ matrix.slug }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/package-wails-artifact.py --version "${VERSION}" --os-slug "${OS_SLUG}" --arch "${ARCH}"
          if [ "${OS_SLUG}" = "windows" ]; then
            test -f "dist-upload/tailcat-box-windows-${ARCH}-installer-${VERSION}.exe"
            test -f "dist-upload/tailcat-box-windows-${ARCH}-${VERSION}.exe"
            if [ -e "dist-upload/tailcat-box-windows-${ARCH}-${VERSION}.zip" ]; then
              echo "refusing a Windows portable zip; ship the bare portable exe and the installer" >&2
              exit 1
            fi
          else
            test -f "dist-upload/tailcat-box-macos-${ARCH}-${VERSION}.dmg"
          fi

      - name: Verify macOS privacy usage descriptions
        if: matrix.slug == 'macos'
        run: |
          set -euo pipefail
          app_plist="build/bin/tailcat-box.app/Contents/Info.plist"
          if [ ! -f "${app_plist}" ]; then
            echo "missing ${app_plist}" >&2
            find build/bin -name Info.plist -print >&2 || true
            exit 1
          fi
          shopt -s nullglob
          dmgs=(dist-upload/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "expected one dmg in dist-upload, found ${#dmgs[@]}" >&2
            ls -la dist-upload >&2 || true
            exit 1
          fi
          mount=$(mktemp -d)
          attached=0
          cleanup() {
            if [ "${attached}" -eq 1 ]; then
              hdiutil detach "${mount}" || hdiutil detach -force "${mount}" || true
            fi
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "${dmgs[0]}"
          attached=1
          # macOS runners use bash 3.2, which has no mapfile and whose find has no -quit.
          shipped=""
          while IFS= read -r candidate; do
            if [ -n "${candidate}" ]; then
              shipped="${candidate}"
              break
            fi
          done < <(find "${mount}" -path '*.app/Contents/Info.plist' -print)
          if [ -z "${shipped}" ]; then
            echo "no Info.plist inside ${dmgs[0]}" >&2
            find "${mount}" -print >&2 || true
            exit 1
          fi
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription NSScreenCaptureUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :${key}" "${app_plist}" >/dev/null
            /usr/libexec/PlistBuddy -c "Print :${key}" "${shipped}" >/dev/null
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailcat-box-${{ matrix.slug }}-${{ matrix.arch }}-${{ needs.meta.outputs.version }}
          path: dist-upload/tailcat-box-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [meta, build]
    if: needs.meta.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true

      - name: Compose release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          if [ -f "${notes}" ]; then
            cp "${notes}" release-notes.md
          elif [ -f docs/releases/README.md ]; then
            {
              echo "## ${VERSION}"
              echo
              echo "No per-tag notes file was found at \`${notes}\`."
              echo "Maintainers: copy \`docs/releases/README.md\` to that path before tagging."
              echo
              cat docs/releases/README.md
            } > release-notes.md
          else
            {
              echo "## ${VERSION}"
              echo
              echo "Automated build of Tailcat Box for macOS and Windows."
              echo "Installers are unsigned. See README for install warnings and adapter notes."
            } > release-notes.md
          fi
          ls -la collected
          echo "----- notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          body_path: release-notes.md
          # Windows portable is a bare .exe (no zip). macOS ships .dmg only.
          # collected/*.zip would be unmatched and fail this step.
          files: |
            collected/*.exe
            collected/*.dmg
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
